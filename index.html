<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache">
<meta http-equiv="Pragma" content="no-cache">
<meta name="robots" content="noindex,nofollow"><title>퀴즈</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:18px;line-height:1.6;background:#f5f6f8;color:#222}
.w{max-width:680px;margin:0 auto;padding:14px 14px 90px}
.tabs{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -14px 8px;padding:2px 14px 6px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;font-family:inherit;border:1px solid #d0d0d0;background:#fff;color:#333;border-radius:999px;padding:6px 12px;font-size:15px;line-height:1.25;white-space:nowrap}
.tabs button.on{background:#3b6fe0;border-color:#3b6fe0;color:#fff}
.tabs small{display:block;font-size:12px;font-weight:400;opacity:.85}
.bar{height:8px;background:#ddd;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:#3b6fe0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px;color:#666;margin:8px 0}
.topr{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.numbtn{font-family:inherit;font-size:14px;line-height:1.2;padding:6px 10px;border-radius:999px;border:1px solid #ccc;background:#fff;color:#222}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.panel{background:#fff;width:min(680px,100%);max-height:min(70vh,560px);overflow:auto;border-radius:16px 16px 0 0;padding:12px 14px calc(16px + env(safe-area-inset-bottom))}
.sheetbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.legend{font-size:13px;color:#666;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px}
.grid button{font-family:inherit;height:44px;border-radius:10px;border:2px solid #ddd;background:#f3f4f6;color:#222;font-size:15px;padding:0}
.grid button.ok{background:#e6f7ec;border-color:#1a9a4a;color:#146b34}
.grid button.no{background:#fdeaea;border-color:#d33;color:#a11}
.grid button.h{box-shadow:inset 0 0 0 3px #e6a700}
.grid button.cur{outline:2px solid #3b6fe0;outline-offset:1px}
.meta{font-size:13px;color:#777;margin:-4px 0 6px}
.note{font-size:13px;line-height:1.4;color:#555;margin:0 0 8px}
.q{background:#fff;border-radius:12px;padding:16px;white-space:pre-wrap;word-break:keep-all}
.ch button{display:block;width:100%;text-align:left;margin:10px 0;padding:14px;font-size:18px;border:2px solid #ccc;border-radius:12px;background:#fff;min-height:56px}
.ox{display:flex;gap:12px}.ox button{flex:1;text-align:center;font-size:40px;font-weight:700}
.ch button.ok{border-color:#1a9a4a;background:#e6f7ec}.ch button.no{border-color:#d33;background:#fdeaea}
.cf{display:inline-flex;align-items:center;gap:6px;margin:8px 0 0;font-size:16px}.cf input{width:18px;height:18px;margin:0}
.r{background:#fff;border-radius:12px;padding:16px;margin-top:10px;white-space:pre-wrap}.r b.ok{color:#1a9a4a}.r b.no{color:#d33}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ddd;padding:10px 14px;display:flex;gap:10px;justify-content:center}
.nav button{flex:1;max-width:330px;padding:14px;font-size:18px;border:0;border-radius:12px;background:#3b6fe0;color:#fff}.nav button.s{background:#999}
h2{margin:6px 0}
.hd{position:sticky;top:0;z-index:2;background:#f5f6f8}
.auth{max-width:680px;margin:0 auto;padding:8px 14px;display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:8px;font-size:13px;color:#444}
.auth button{font-family:inherit;font-size:14px;line-height:1.2;padding:8px 12px;border-radius:999px;border:1px solid #ccc;background:#fff;color:#222}
.auth .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:min(58vw,420px)}
.auth .err{flex:1 0 100%;margin:0;background:#fdeaea;color:#9d1c1c;border:1px solid #f0b4b4;border-radius:8px;padding:8px 10px;font-size:14px;line-height:1.4;text-align:left}
.sync{font-size:12px;line-height:1.2;padding:4px 8px;border-radius:999px;background:#eee;color:#444}.sync.ok{background:#e6f7ec;color:#146b34}.sync.bad{background:#fdeaea;color:#9d1c1c}
#t{font-size:14px;line-height:1.45}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#222;color:#fff;font-size:14px;line-height:1.3;padding:8px 14px;border-radius:999px;z-index:40;pointer-events:none;max-width:calc(100% - 28px);text-align:center}
</style></head><body><header class="hd"><div class="auth" id="authbar">로그인 준비 중…</div></header><div class="w" id="app">불러오는 중…</div><div class="nav" id="nav"></div>
<script type="module" src="quiz.js?v=20261015b"></script></body></html>
